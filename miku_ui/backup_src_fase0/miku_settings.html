<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configuración · Miku v0.1.7 Beta</title>
<link rel="icon" type="image/png" href="assets/icon_settings.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
<script src="bridge.js"></script>
<script src="sound_fx.js"></script>
<script src="miku_ui.js"></script>
<link rel="stylesheet" href="settings.css"></head><body>
<div class="app-window">
  <div class="top-chrome" data-tauri-drag-region>
    <div class="chrome-title" data-tauri-drag-region>
      <img src="assets/icon_settings.png" width="18" height="18" style="border-radius:4px;object-fit:contain;flex:none;" alt="Ajustes">
      <span class="chrome-text">Configuración · Miku</span>
      <div class="chrome-badge">v0.1.7 Beta</div>
    </div>
    <div class="win-ctrls">
      <span id="hb-win-update" style="display:none;margin-right:8px" title="Mantén pulsado para reiniciar y aplicar actualización"></span>
      <button type="button" class="wc-btn min" id="win-min" title="Minimizar" aria-label="Minimizar"></button>
      <button type="button" class="wc-btn cls" id="win-cls" title="Cerrar" aria-label="Cerrar"></button>
    </div>
  </div>
  <div class="app-scroll">
    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-avatar-card">
          <div class="sidebar-avatar-mw">
            <canvas id="sidebar-hl" class="hl" data-who="miku" width="110" height="110"></canvas>
          </div>
          <div class="sidebar-brand-name">Miku</div>
        </div>
        <nav class="rail" id="rail" aria-label="Secciones de configuración"></nav>
        <div class="sidebar-footer">
          <div class="sidebar-status-pill">
            <span class="pulse-dot"></span>
            <span>Listo · v0.1.7 Beta</span>
          </div>
        </div>
      </aside>
      <main class="pane" id="pane"></main>
    </div>
  </div>
</div>

<script src="settings.js"></script>
</body></html>
