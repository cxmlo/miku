name: 'Build Miku Desktop (.exe)'

on:
  workflow_dispatch:
    inputs:
      targetTag:
        description: 'Tag de release existente a la que adjuntar el instalador (opcional, ej. v0.2.0)'
        required: false
        default: ''
        type: string

jobs:
  build-desktop:
    name: Compilar Instalador Windows (.exe)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'miku_ui/package-lock.json'

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Instalar dependencias Frontend
        working-directory: ./miku_ui
        run: npm ci

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias Python & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Miku Core Sidecar (--onedir)
        shell: pwsh
        run: python scripts/build_sidecar.py

      - name: Compilar Aplicación Tauri (NSIS .exe)
        working-directory: ./miku_ui
        run: npm run tauri build

      - name: Localizar y preparar Miku_Setup.exe
        shell: pwsh
        id: locate_exe
        run: |
          $exe = Get-ChildItem -Path "miku_ui/src-tauri/target/release/bundle/nsis/*.exe" | Where-Object { $_.Name -notlike "*Miku_Setup.exe" } | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No se encontro ningun instalador .exe en el directorio nsis"
            exit 1
          }
          Write-Host "Instalador encontrado: $($exe.FullName)"
          Copy-Item $exe.FullName "Miku_Setup.exe" -Force
          echo "exe_path=Miku_Setup.exe" >> $env:GITHUB_OUTPUT

      - name: Subir artefacto para descarga directa en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Miku-Desktop-Setup-exe
          path: Miku_Setup.exe
          retention-days: 14

      - name: Adjuntar instalador a GitHub Release (si se especifico tag)
        if: github.event.inputs.targetTag != ''
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.targetTag }}"
          Write-Host "Adjuntando Miku_Setup.exe a la release: $tag"
          gh release upload $tag Miku_Setup.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

