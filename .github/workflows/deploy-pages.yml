name: Deploy Miku Website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del despliegue manual'
        required: false
        default: 'Publicar actualización de la web Miku Desktop'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preparar y empaquetar sitio web
        run: |
          mkdir -p website
          # Copiar toda la interfaz web de Miku
          cp -r miku_ui/src/* website/
          # Copiar assets globales (iconos, imágenes)
          if [ -d "assets" ]; then cp -r assets website/; fi
          # Copiar catálogo oficial
          if [ -f "miku-catalogo.html" ]; then cp miku-catalogo.html website/catalogo.html; fi
          # Asegurar que index.html sea la ventana de configuración y showcase principal
          cp miku_ui/src/miku_settings.html website/index.html
          cp miku_ui/src/index.html website/island.html
          echo "=== ARCHIVOS PREPARADOS EN WEBSITE/ ==="
          ls -la website/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
