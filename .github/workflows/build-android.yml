name: 'Build Miku Android APK (.apk)'

on:
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Tipo de compilacion (release o debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      targetTag:
        description: 'Tag de release existente a la que adjuntar el APK (opcional, ej. v0.2.0)'
        required: false
        default: ''
        type: string

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias del SDK de Android
        run: |
          yes | sdkmanager --licenses || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Asignar permisos de ejecucion a gradlew
        working-directory: ./miku_android
        run: chmod +x gradlew

      - name: Preparar Keystore de Firma Release
        id: setup_keystore
        run: |
          mkdir -p "${{ runner.temp }}"
          if [ -n "$KEYSTORE_DATA" ]; then
            echo "Decodificando Keystore oficial desde secretos protegidos..."
            echo "$KEYSTORE_DATA" | tr -d '\r\n ' | base64 -d > "${{ runner.temp }}/miku-release.jks" 2>/dev/null || true
          fi

          if [ ! -s "${{ runner.temp }}/miku-release.jks" ]; then
            echo "[INFO] Generando keystore de firma de respaldo con keytool..."
            keytool -genkey -v -keystore "${{ runner.temp }}/miku-release.jks" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Miku Mobile,O=Miku,C=US"
            echo "keystore_password=android" >> $GITHUB_OUTPUT
            echo "key_alias=androiddebugkey" >> $GITHUB_OUTPUT
            echo "key_password=android" >> $GITHUB_OUTPUT
          else
            echo "[OK] Keystore decodificado exitosamente de los secretos."
            echo "keystore_password=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "key_alias=${{ secrets.KEY_ALIAS }}" >> $GITHUB_OUTPUT
            echo "key_password=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_OUTPUT
          fi
          echo "keystore_path=${{ runner.temp }}/miku-release.jks" >> $GITHUB_OUTPUT
        env:
          KEYSTORE_DATA: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Compilar APK (${{ github.event.inputs.buildType || 'release' }})
        working-directory: ./miku_android
        run: |
          BUILD_TYPE="${{ github.event.inputs.buildType || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi
        env:
          KEYSTORE_PATH: ${{ steps.setup_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ steps.setup_keystore.outputs.keystore_password }}
          KEY_ALIAS: ${{ steps.setup_keystore.outputs.key_alias }}
          KEY_PASSWORD: ${{ steps.setup_keystore.outputs.key_password }}

      - name: Limpiar archivo de firma temporal
        if: always()
        run: |
          rm -f "${{ runner.temp }}/miku-release.jks"

      - name: Localizar y renombrar APK generado
        id: locate_apk
        run: |
          APK_PATH=$(find miku_android/app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No se encontro ningun archivo APK generado en miku_android/app/build/outputs/apk/"
            exit 1
          fi
          echo "APK generado encontrado en: $APK_PATH"
          cp "$APK_PATH" miku-mobile.apk
          echo "apk_path=miku-mobile.apk" >> $GITHUB_OUTPUT
          
          echo "=== HUELLA DIGITAL DE LA FIRMA (SHA-256) ==="
          keytool -printcert -jarfile miku-mobile.apk 2>/dev/null | grep -E "SHA256:|Owner:" || true

      - name: Subir artefacto APK para descarga directa en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Miku-Mobile-APK
          path: miku-mobile.apk
          retention-days: 14

      - name: Adjuntar APK a GitHub Release (si se especifico tag)
        if: github.event.inputs.targetTag != ''
        run: |
          TAG="${{ github.event.inputs.targetTag }}"
          echo "Adjuntando miku-mobile.apk a la release con tag: $TAG"
          gh release upload "$TAG" miku-mobile.apk --clobber || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
