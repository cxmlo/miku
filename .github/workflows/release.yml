name: 'Release Miku Desktop'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Release Tag (ej. v0.1.2)'
        required: true
        default: 'v0.1.2'
        type: string
      releaseNotes:
        description: 'Descripción / Notas de la versión (dejar vacío para usar RELEASE_NOTES.md)'
        required: false
        default: ''
        type: string

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'miku_ui/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        working-directory: ./miku_ui
        run: npm ci

      - name: Sanitize Signing Key
        shell: pwsh
        run: |
          $cleanKey = "$env:RAW_KEY".Trim()
          "TAURI_SIGNING_PRIVATE_KEY=$cleanKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Miku Core Sidecar
        shell: pwsh
        run: |
          python scripts/build_sidecar.py

      - name: Prepare Release Description
        shell: pwsh
        run: |
          $inputNotes = "${{ github.event.inputs.releaseNotes }}".Trim()
          if ($inputNotes) {
            $notes = $inputNotes
          } elseif (Test-Path "RELEASE_NOTES.md") {
            $notes = Get-Content "RELEASE_NOTES.md" -Raw
          } else {
            $notes = "Actualización de Miku Desktop con mejoras de rendimiento y estabilidad."
          }
          "RELEASE_BODY<<EOF" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $notes | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./miku_ui
          tagName: ${{ github.event.inputs.tagName || github.ref_name }}
          releaseName: 'Miku Desktop ${{ github.event.inputs.tagName || github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false

      - name: Upload Miku_Setup.exe alias for direct web download
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tagName || github.ref_name }}"
          $exe = Get-ChildItem -Path "miku_ui/src-tauri/target/release/bundle/nsis/*.exe" | Where-Object { $_.Name -notlike "*Miku_Setup.exe" } | Select-Object -First 1
          if ($exe) {
            $aliasPath = Join-Path $exe.DirectoryName "Miku_Setup.exe"
            Copy-Item $exe.FullName $aliasPath -Force
            gh release upload $tag "$aliasPath" --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


