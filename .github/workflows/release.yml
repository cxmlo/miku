name: 'Release Miku Desktop & Mobile'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Release Tag (ej. v0.1.6)'
        required: true
        default: 'v0.1.6'
        type: string
      releaseNotes:
        description: 'Descripcion / Notas de la version (dejar vacio para usar RELEASE_NOTES.md)'
        required: false
        default: ''
        type: string

jobs:
  release-desktop:
    name: Compilar y Publicar Miku Desktop
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    outputs:
      tag: ${{ github.event.inputs.tagName || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'miku_ui/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        working-directory: ./miku_ui
        run: npm ci

      - name: Sanitize Signing Key
        shell: pwsh
        run: |
          $cleanKey = "$env:RAW_KEY".Trim()
          "TAURI_SIGNING_PRIVATE_KEY=$cleanKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Miku Core Sidecar (--onedir)
        shell: pwsh
        run: |
          python scripts/build_sidecar.py

      - name: Prepare Release Description
        shell: pwsh
        run: |
          $inputNotes = "${{ github.event.inputs.releaseNotes }}".Trim()
          if ($inputNotes) {
            $notes = $inputNotes
          } elseif (Test-Path "RELEASE_NOTES.md") {
            $notes = Get-Content "RELEASE_NOTES.md" -Raw
          } else {
            $notes = "Actualizacion de Miku Desktop con mejoras de rendimiento, conexion de modelos y estabilidad."
          }
          "RELEASE_BODY<<EOF" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $notes | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./miku_ui
          tagName: ${{ github.event.inputs.tagName || github.ref_name }}
          releaseName: 'Miku Desktop ${{ github.event.inputs.tagName || github.ref_name }}'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false

      - name: Upload Miku_Setup.exe alias for direct web download
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tagName || github.ref_name }}"
          $exe = Get-ChildItem -Path "miku_ui/src-tauri/target/release/bundle/nsis/*.exe" | Where-Object { $_.Name -notlike "*Miku_Setup.exe" } | Select-Object -First 1
          if ($exe) {
            $aliasPath = Join-Path $exe.DirectoryName "Miku_Setup.exe"
            Copy-Item $exe.FullName $aliasPath -Force
            gh release upload $tag "$aliasPath" --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-android:
    name: Compilar y Adjuntar APK Android a la Release
    needs: release-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias del SDK de Android
        run: |
          yes | sdkmanager --licenses || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Asignar permisos de ejecucion a gradlew
        working-directory: ./miku_android
        run: chmod +x gradlew

      - name: Compilar APK Release
        working-directory: ./miku_android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Localizar y renombrar APK generado
        id: locate_apk
        run: |
          APK_PATH=$(find miku_android/app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No se encontro ningun archivo APK generado en miku_android/app/build/outputs/apk/"
            exit 1
          fi
          echo "APK encontrado en: $APK_PATH"
          cp "$APK_PATH" miku-mobile.apk

      - name: Adjuntar APK a la Release creada
        run: |
          TAG="${{ needs.release-desktop.outputs.tag || github.event.inputs.tagName || github.ref_name }}"
          echo "Subiendo miku-mobile.apk a la release: $TAG"
          gh release upload "$TAG" miku-mobile.apk --clobber || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-website:
    name: Sincronizar y Actualizar Web (gh-pages)
    needs: [release-desktop, release-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruir y desplegar gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scratch/rebuild_gh_pages.py
          python scripts/update_gh_pages.py
          git push origin gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

