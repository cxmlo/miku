<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miku · Dynamic Island para Windows</title>
<link rel="icon" type="image/png" href="assets/app_icon.png">
<link rel="apple-touch-icon" href="assets/app_icon.png">
<style>
:root{color-scheme:dark;--bg:#000;--fg:#f5f5f7;--mut:#8e919a;--line:#2a2a2d;--card:#0a0a0b;--mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;--sans:'SF Pro Display','Segoe UI Variable','Segoe UI',system-ui,sans-serif;--spr:cubic-bezier(.3,1.35,.5,1);--ease:cubic-bezier(.16,1,.3,1);--soft:cubic-bezier(.32,.72,0,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans);overflow-x:hidden;background-image:radial-gradient(#ffffff17 1px,transparent 1px);background-size:24px 24px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(420px circle at var(--mx,50%) var(--my,20%),#ffffff0f,transparent 70%);transition:background .4s}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 3px)}
a{color:inherit;text-decoration:none}
section,header,footer{position:relative;z-index:1;padding:0 max(18px,calc((100vw - 1040px)/2))}
.mono{font:12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
#pg{position:fixed;top:0;left:0;height:2px;width:0;background:#fff;z-index:60}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;display:flex;justify-content:center;gap:clamp(12px,4vw,34px);padding:14px 16px;backdrop-filter:blur(18px);background:#000a;border-bottom:1px solid #ffffff12}
nav a{font:12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);transition:color .3s var(--soft)}
nav a:hover,nav a.dl{color:#fff}nav a.dl{border-bottom:1px solid #fff}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{display:inline-block;padding:13px 26px;border-radius:30px;font-weight:600;background:#fff;color:#000;transition:transform .45s var(--spr),background .3s var(--soft),color .3s var(--soft),translate .3s var(--soft)}
.btn.g{background:none;color:#fff;box-shadow:inset 0 0 0 1px #ffffff55}.btn:hover{transform:scale(1.05)}.btn:active{transform:scale(.95)}.btn.g:hover{background:#fff;color:#000}
.hero{text-align:center;padding-top:110px;padding-bottom:30px}
h1{font-size:clamp(64px,15vw,150px);line-height:.95;letter-spacing:-.06em;font-weight:600;margin:8px 0 6px}
.cur{display:inline-block;width:.5em;height:2px;background:#fff;margin-left:4px;animation:cb 1s steps(1) infinite}
@keyframes cb{50%{opacity:0}}
.sub{color:var(--mut);max-width:540px;margin:16px auto 26px;font-size:19px}
h2{font-size:clamp(32px,6vw,56px);letter-spacing:-.04em;line-height:1.05;font-weight:600}
.sec{padding-top:100px}.sec>p{color:var(--mut);margin:12px 0 28px;max-width:560px}
.win{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .6s var(--soft),background .4s var(--soft),color .4s var(--soft),border-color .4s var(--soft),box-shadow .6s var(--soft);position:relative}
.tb{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(0deg,#ffffff10 0 1px,transparent 1px 4px);transition:.4s var(--soft)}
.tb i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1px #777}.tb span{margin:0 auto;font:11px var(--mono);letter-spacing:.1em;color:var(--mut);text-transform:uppercase;background:var(--card);padding:0 10px;transition:.4s var(--soft)}
.bd{padding:20px}
.screen{position:relative;height:calc(400px*var(--k,1));overflow:hidden;background:radial-gradient(#ffffff12 1px,transparent 1px) 0 0/18px 18px,#050506;border-bottom:1px solid var(--line)}
.screen iframe{position:absolute;top:0;left:50%;width:720px;height:400px;margin-left:-360px;border:0;background:transparent;transform:scale(var(--k,1));transform-origin:top center}
.ctl{padding:16px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pill{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:8px 13px;border-radius:18px;box-shadow:inset 0 0 0 1px var(--line);color:var(--mut);transition:transform .45s var(--spr),background .3s var(--soft),color .3s var(--soft),box-shadow .3s var(--soft)}
.pill:hover{color:#fff;transform:translateY(-3px);box-shadow:inset 0 0 0 1px #888}.pill:active{transform:scale(.93)}.pill.on{background:#fff;color:#000;box-shadow:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{cursor:pointer}.card:hover{transform:translateY(-7px);background:#fff;color:#000;border-color:#fff;box-shadow:0 22px 40px -20px #fff4}
.card:hover .tb{border-color:#0002;background:repeating-linear-gradient(0deg,#0002 0 1px,transparent 1px 4px)}
.card:hover .tb span{background:#fff;color:#444}
.card h3{font-size:19px;letter-spacing:-.02em;font-weight:600;margin:6px 0 4px}.card p{color:var(--mut);font-size:14px;transition:color .4s var(--soft)}.card:hover p{color:#444}
.card .n{font:11px var(--mono);color:var(--mut)}.card:hover .n{color:#444}
.card .go{display:inline-block;margin-top:12px;font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;opacity:.5;transform:translateX(-6px);transition:.5s var(--soft)}.card:hover .go{opacity:1;transform:none}
.card.hide{display:none}
.rv{opacity:0;transform:translateY(34px) scale(.985)}.rv.in{opacity:1;transform:none;transition:opacity .9s var(--soft),transform .9s var(--soft)}
@keyframes drop{from{opacity:0;transform:translateY(16px) scale(.97)}}
.set{height:680px;display:block;width:100%;border:0;background:#0e0f12}
.dl{text-align:center}.dl .bd{padding:54px 20px}
.blk{display:flex;gap:3px;justify-content:center;margin:22px auto 0;opacity:0;transition:opacity .4s var(--soft)}.blk.on{opacity:1}.blk u{width:11px;height:16px;border:1px solid #555;transition:.25s var(--soft)}.blk u.f{background:#fff;border-color:#fff}
.lg{position:relative;display:flex;margin-left:6px;padding:2px;border-radius:16px;box-shadow:inset 0 0 0 1px #ffffff30}
.lg b{position:absolute;top:2px;left:2px;width:34px;height:calc(100% - 4px);border-radius:14px;background:#fff;transition:transform .55s var(--spr)}
.lg.es b{transform:translateX(34px)}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;color:#fff}
.brand img{width:22px;height:22px;border-radius:6px;box-shadow:0 0 10px rgba(0,242,254,0.3);object-fit:cover;flex:none}
.gh-btn{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:14px;box-shadow:inset 0 0 0 1px #ffffff25;color:var(--mut);font:11px var(--mono);text-transform:uppercase;transition:color .25s var(--soft),box-shadow .25s var(--soft)}
.gh-btn:hover{color:#fff;box-shadow:inset 0 0 0 1px #ffffff60}
.gh-btn svg{width:13px;height:13px;fill:currentColor;flex:none}
.lg button{position:relative;z-index:1;width:34px;padding:3px 0;font:11px var(--mono);letter-spacing:.08em;color:var(--mut);transition:color .3s var(--soft)}.lg button.on{color:#000}
.sw{transition:opacity .25s var(--soft)}
footer{text-align:center;padding-top:60px;padding-bottom:50px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

/* === Mobile Responsive Polish === */
.screen-set{position:relative;height:calc(740px*var(--k-set,1));overflow:hidden;background:#0c0d10;border-bottom:0}
.screen-set iframe{position:absolute;top:0;left:50%;width:960px;height:740px;margin-left:-480px;border:0;background:transparent;transform:scale(var(--k-set,1));transform-origin:top center}

@media(max-width:768px){
  section,header,footer{padding:0 14px}
  nav{padding:10px 14px;gap:8px;justify-content:space-between;align-items:center}
  nav .nav-link-sub{display:none}
  nav .brand{font-size:13.5px}
  nav .gh-btn{padding:4px 8px}
  nav .gh-btn span{display:none}
  .hero{padding-top:76px;padding-bottom:20px}
  h1{font-size:clamp(46px,13vw,68px);letter-spacing:-.04em}
  .sub{font-size:15.5px;padding:0 6px;margin:12px auto 20px}
  .btn{padding:11px 20px;font-size:14px}
  .sec{padding-top:54px}
  .sec>p{margin:8px 0 20px}
  .ctl{display:flex;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:12px 14px;gap:7px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .ctl::-webkit-scrollbar{display:none}
  .ctl .pill{flex:none;font-size:10.5px;padding:7px 11px}
  .tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;gap:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs .pill{flex:none}
  .grid{grid-template-columns:1fr;gap:12px}
  .dl .bd{padding:34px 16px}
}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const dec=id=>new TextDecoder().decode(Uint8Array.from(atob($(id).textContent.trim()),c=>c.charCodeAt(0)));
const fi=$('#fi'),W=()=>fi.contentWindow;
/* iframes reales, cargados al ser visibles (así la intro de Miku se ve) */
const lazy=(el,id)=>{const o=new IntersectionObserver(e=>{if(e[0].isIntersecting){el.srcdoc=dec(id);o.disconnect()}},{rootMargin:'200px'});o.observe(el)};
lazy(fi,'#d1');lazy($('#fs'),'#d2');
/* escala responsive de la pantalla */
const fit=()=>{
  const scr=$('#scr');
  if(scr){
    const k=Math.min(1,scr.clientWidth/720);
    $('#demo').style.setProperty('--k',k);
  }
  const s=$('#scr-set');
  if(s){
    const ks=Math.min(1,s.clientWidth/960);
    $('#win-set').style.setProperty('--k-set',ks);
  }
};
addEventListener('resize',fit);fit();
setTimeout(fit,150);
/* Miku te mira en toda la página */
addEventListener('pointermove',e=>{document.body.style.setProperty('--mx',e.clientX+'px');document.body.style.setProperty('--my',e.clientY+'px');
 try{const r=fi.getBoundingClientRect(),k=r.width/720;W().feed((e.clientX-r.left)/k,(e.clientY-r.top)/k)}catch{}});
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.style.transitionDelay=(x.target.dataset.d||0)+'s';x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.08});
$$('.rv').forEach((e,i)=>{e.dataset.d=(i%4)*.06;io.observe(e)});
