<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Miku V2 - Grafo 3D</title>
  <style> 
    body { margin: 0; padding: 0; overflow: hidden; background-color: #0b0b0d; font-family: sans-serif; } 
    #info { position: absolute; top: 10px; left: 10px; color: rgba(255,255,255,0.7); z-index: 10; pointer-events: none; }
  </style>
  <script src="https://unpkg.com/3d-force-graph"></script>
</head>
<body>
  <div id="info">
    <h2>Miku V2 Knowledge Graph</h2>
    <p>Rueda del ratón: Zoom<br>Clic Izquierdo: Rotar<br>Clic en un nodo: Acercarse</p>
  </div>
  <div id="3d-graph"></div>
  
  <script>
    const gData = {"nodes": [{"id": "Home", "group": 1, "name": "Home"}, {"id": "Project_Structure", "group": 1, "name": "Project Structure"}, {"id": "Audio_and_Voice", "group": 5, "name": "Audio and Voice"}, {"id": "Backend_Gateway", "group": 2, "name": "Backend Gateway"}, {"id": "Main_and_Agents", "group": 2, "name": "Main and Agents"}, {"id": "Mobile_App", "group": 6, "name": "Mobile App"}, {"id": "Widgets_and_UI", "group": 6, "name": "Widgets and UI"}, {"id": "Memory_System", "group": 4, "name": "Memory System"}, {"id": "Database_and_Security", "group": 7, "name": "Database and Security"}, {"id": "OS_and_Computer", "group": 3, "name": "OS and Computer"}, {"id": "Tools_Overview", "group": 3, "name": "Tools Overview"}, {"id": "Web_and_Media", "group": 3, "name": "Web and Media"}], "links": [{"source": "Home", "target": "Project_Structure"}, {"source": "Home", "target": "Backend_Gateway"}, {"source": "Home", "target": "Main_and_Agents"}, {"source": "Home", "target": "Tools_Overview"}, {"source": "Home", "target": "OS_and_Computer"}, {"source": "Home", "target": "Web_and_Media"}, {"source": "Home", "target": "Memory_System"}, {"source": "Home", "target": "Audio_and_Voice"}, {"source": "Home", "target": "Mobile_App"}, {"source": "Home", "target": "Widgets_and_UI"}, {"source": "Home", "target": "Database_and_Security"}, {"source": "Project_Structure", "target": "Mobile_App"}, {"source": "Project_Structure", "target": "Widgets_and_UI"}, {"source": "Project_Structure", "target": "Memory_System"}, {"source": "Project_Structure", "target": "Database_and_Security"}, {"source": "Project_Structure", "target": "Backend_Gateway"}, {"source": "Project_Structure", "target": "Main_and_Agents"}, {"source": "Project_Structure", "target": "Widgets_and_UI"}, {"source": "Project_Structure", "target": "Memory_System"}, {"source": "Project_Structure", "target": "Audio_and_Voice"}, {"source": "Project_Structure", "target": "Database_and_Security"}, {"source": "Project_Structure", "target": "Tools_Overview"}, {"source": "Project_Structure", "target": "Home"}, {"source": "Audio_and_Voice", "target": "Home"}, {"source": "Backend_Gateway", "target": "Database_and_Security"}, {"source": "Backend_Gateway", "target": "Home"}, {"source": "Backend_Gateway", "target": "Main_and_Agents"}, {"source": "Main_and_Agents", "target": "Home"}, {"source": "Main_and_Agents", "target": "Memory_System"}, {"source": "Mobile_App", "target": "Home"}, {"source": "Mobile_App", "target": "Backend_Gateway"}, {"source": "Widgets_and_UI", "target": "Backend_Gateway"}, {"source": "Widgets_and_UI", "target": "Home"}, {"source": "Memory_System", "target": "Main_and_Agents"}, {"source": "Memory_System", "target": "Home"}, {"source": "Database_and_Security", "target": "Mobile_App"}, {"source": "Database_and_Security", "target": "Widgets_and_UI"}, {"source": "Database_and_Security", "target": "Mobile_App"}, {"source": "Database_and_Security", "target": "Home"}, {"source": "OS_and_Computer", "target": "Tools_Overview"}, {"source": "Tools_Overview", "target": "OS_and_Computer"}, {"source": "Tools_Overview", "target": "Web_and_Media"}, {"source": "Tools_Overview", "target": "Widgets_and_UI"}, {"source": "Tools_Overview", "target": "Home"}, {"source": "Web_and_Media", "target": "Tools_Overview"}]};
    
    // Paleta de colores vibrantes para cada módulo
    const colorPorGrupo = {
      1: '#ffffff', // Home / Estructura (Blanco)
      2: '#ff3366', // Core (Rojo/Rosa)
      3: '#33ccff', // Tools (Azul claro)
      4: '#cc33ff', // Memory (Púrpura)
      5: '#33ff99', // Audio (Verde neón)
      6: '#ff9933', // Frontend (Naranja)
      7: '#ffff33'  // Security (Amarillo)
    };

    const Graph = ForceGraph3D()
      (document.getElementById('3d-graph'))
        .graphData(gData)
        .nodeLabel('name')
        .nodeColor(node => colorPorGrupo[node.group] || '#00ffff')
        .nodeRelSize(7) // Tamaño de las esferas
        .linkWidth(1.5)
        .linkOpacity(0.4) // Enlaces sutiles
        .linkColor(() => 'rgba(255, 255, 255, 0.25)')
        .onNodeClick(node => {
          // Animación de vuelo de cámara al hacer clic en un nodo
          const distance = 40;
          const distRatio = 1 + distance/Math.hypot(node.x, node.y, node.z);
          Graph.cameraPosition(
            { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio }, 
            node, // mirar al nodo
            2000  // duración (ms)
          );
        });
        
    // Agregar partículas de luz moviéndose por los enlaces para dar vida al grafo
    Graph.linkDirectionalParticles(2)
         .linkDirectionalParticleWidth(1.5)
         .linkDirectionalParticleSpeed(d => 0.005);
  </script>
</body>
</html>
