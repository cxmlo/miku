<!DOCTYPE html>

<html lang="es"><head><meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Mochi Island</title>

<style>

*{box-sizing:border-box}

html,body{margin:0;height:100%;background:#0d0f14;font:15px system-ui,"Segoe UI",sans-serif;color:#fff;overflow:hidden;user-select:none}

/* Tauri: el fondo pasa a transparente y #demo se oculta solo (ver sección Tauri al final) */

#isl{position:fixed;top:0;left:50%;translate:-50% 0;background:#000;overflow:hidden;width:80px;height:24px;border-radius:0 0 12px 12px;

  transition:width .55s cubic-bezier(.3,1.35,.5,1),height .55s cubic-bezier(.3,1.35,.5,1),border-radius .45s}

/* #in mide lo que mida su contenido (max-content) entre min-width y max-width; la isla se ajusta a esa medida */

#in{position:absolute;left:0;top:0;width:max-content;transition:opacity .25s}#in.ex{padding:0 14px 14px}

#cv{position:absolute;left:0;top:0;width:300px;height:300px;pointer-events:none;z-index:3}

.strip{height:100%;display:flex;align-items:center;padding:0 10px}

.ms{margin-left:auto;display:flex;gap:4px;zoom:.6}

.top{height:46px;display:flex;align-items:center;gap:10px;padding:0 6px;color:#8a8d96}

.top b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#8a8d96;transition:background .2s,color .2s}.top b:hover{color:#fff}

.top b.on{background:#202226;color:#fff}.top span{margin-left:auto;font-size:14px}.top u{text-decoration:none;opacity:.6;display:grid}

.row{display:flex}.side{display:flex;flex-direction:column;gap:10px;justify-content:center;width:44px;margin-left:8px}

.mi{display:block;width:36px;height:26px;border-radius:50% 50% 46% 46%;position:relative;

  background:radial-gradient(circle at 34% 68%,#14141c 1.8px,#0000 2.3px),radial-gradient(circle at 66% 68%,#14141c 1.8px,#0000 2.3px),linear-gradient(#fff5,#0000 60%),var(--c)}

.mi:before{content:"";position:absolute;left:-2px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--d);border:1.5px solid #14141c}

.card{flex:1;display:flex;align-items:center;gap:18px;padding:18px 24px 18px 14px;border-radius:24px;border:1px solid #24262c;

  background:linear-gradient(to top,var(--g,#0000),#0000 45%),#17181c}

.card.dz{border:1.5px dashed #1f7a5c;min-height:170px}

.ph{display:block;flex:none;cursor:pointer}

.c{flex:1;min-width:0}.l{display:flex;gap:8px;align-items:center;margin-bottom:6px;color:#8e919a}.l b{color:#fff}

.dt{width:12px;height:12px;border-radius:50%}

.h{font-size:21px;font-weight:700;line-height:1.25}.s{font-size:18px;color:#8e919a;margin-top:6px;line-height:1.35}.err{color:#ff7b8b}

.bt{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

button{font:inherit;font-size:17px;line-height:1.2;max-width:100%;border:0;border-radius:99px;padding:12px 24px;cursor:pointer;color:#fff;background:#2b2d33}

button:hover{filter:brightness(1.2)}button.p{background:#f4f5f7;color:#111}

kbd{font:12px system-ui;border:1px solid #888;border-radius:5px;padding:0 5px;margin-left:10px;color:#aaa}

button.p kbd{color:#555;border-color:#666}

code{display:inline-block;background:#202227;border:1px solid #2c2e35;border-radius:12px;padding:10px 16px;font:19px Consolas,monospace;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chips i{font-style:normal;background:#26282d;color:#aaa;border-radius:99px;padding:5px 12px;font-size:15px}

.two{display:flex;gap:12px}.two .card{flex:1.25;gap:10px;padding:14px 16px 14px 8px;min-width:0}.two .c2{flex:none;display:flex;flex-direction:column;gap:8px;justify-content:center;padding:14px;border-radius:24px;border:1px solid #24262c;background:#131418}

.mc{width:44px;height:35px;display:block;transition:transform .2s}

.side button,.ms button{background:none;border:0;padding:0;border-radius:0;display:block}

.side button:hover .mc,.ms button:hover .mc{transform:scale(1.18)}

.chip{display:flex;align-items:center;gap:6px;padding:4px 14px 4px 5px;border:1px solid var(--c);border-radius:99px;color:var(--c);font-size:14px;background:color-mix(in srgb,var(--c) 14%,#111)}

.chip .mc{width:48px;height:38px}

.tl p{margin:6px 0;font-size:15px;color:#fff;display:flex;align-items:center;gap:8px;min-width:0}.tl p .tx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lvw{display:grid}.lvw>span{grid-area:1/1;visibility:hidden;overflow:hidden;text-overflow:ellipsis}.lvw>span.on{visibility:visible}.tl .l{font-size:14px}.tl button{font-size:14px;padding:9px 18px}.tl p.d{color:#5a5d66}

.fld{display:flex;gap:20px;background:#212227;border-radius:14px;padding:14px 18px;margin-top:8px;color:#777;align-items:center}

.fld input{flex:1;min-width:260px;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:18px}.fld label{flex:none;min-width:48px}

.up{flex:1;min-width:460px;padding:22px 34px 22px}.up .l2{display:flex;justify-content:space-between;color:#a9acb4;font-size:19px}

.pg{position:relative;height:12px;background:#2a2c30;border-radius:9px;margin:30px 0 8px}.pg #fl{position:absolute;left:0;top:0;height:100%;border-radius:9px;background:linear-gradient(90deg,#1fa87c,#2dd4a0)}

.pg #rd{position:absolute;top:6px;transform:translate(-50%,-50%)}

.pill{display:inline-flex;gap:8px;align-items:center;background:#262830;border-radius:99px;padding:8px 14px;color:#ddd;font-size:17px;margin-bottom:8px}

.mic{flex:none;width:46px;height:46px;border-radius:50%;padding:0}

.res{display:flex;justify-content:space-between;gap:24px;background:#212227;border-radius:14px;padding:12px 20px;margin-bottom:8px;font-size:19px}.res span{color:#8e919a}

/* ===== micro-interacciones: hover, pulsado y ondas (ripple) ===== */

button,.top b{position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.3,1.6,.5,1),filter .18s,background .2s,color .2s,box-shadow .2s}

button:hover,.top b:hover{transform:scale(1.05)}

button:active,.top b:active{transform:scale(.95);transition-duration:.08s}

button.p:hover{box-shadow:0 0 0 4px #ffffff1f,0 6px 20px #ffffff2a}

.mic:hover,.top b:hover{box-shadow:0 0 14px #ffffff26}

.mic:hover .i,.top b:hover .i{filter:drop-shadow(0 0 4px currentColor)}

.chip:hover{box-shadow:0 0 16px color-mix(in srgb,var(--c) 45%,transparent)}

.side button,.ms button{overflow:visible}

.side button:hover,.ms button:hover,.side button:active,.ms button:active{transform:none}

button:focus-visible{outline:2px solid #5cc8ff;outline-offset:2px}

.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);pointer-events:none;animation:rip .6s ease-out forwards}

@keyframes rip{to{transform:scale(1);opacity:0}}

/* ===== voz: escuchando / pensando / hablando ===== */

#isl.vz{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--vc) 55%,transparent),0 8px 28px color-mix(in srgb,var(--vc) 28%,transparent);animation:vpulse 1.6s ease-in-out infinite}

@keyframes vpulse{50%{box-shadow:0 0 0 2.5px color-mix(in srgb,var(--vc) 80%,transparent),0 10px 38px color-mix(in srgb,var(--vc) 48%,transparent)}}

@keyframes rise{0%{transform:translateY(-8px) scale(.9,.8)}40%{transform:translateY(4px) scale(1.04,1.07)}70%{transform:translateY(-1px) scale(.99,.98)}100%{transform:none}}

#isl.rise{animation:rise .65s cubic-bezier(.2,1.5,.4,1)}

#isl.vz.rise{animation:rise .65s cubic-bezier(.2,1.5,.4,1),vpulse 1.6s .65s ease-in-out infinite}

.live{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--lc,#22c5e8);animation:blink 1.1s ease-in-out infinite}

@keyframes blink{50%{opacity:.25}}

.eq{display:flex;align-items:center;gap:4px;height:34px;margin-top:14px}

.eq i{flex:none;width:5px;height:100%;border-radius:3px;background:var(--bc,#22c5e8);transform:scaleY(.1)}

#tr.on{color:#fff}

.ell i{font-style:normal;animation:ell 1.2s infinite both}.ell i:nth-child(2){animation-delay:.2s}.ell i:nth-child(3){animation-delay:.4s}

@keyframes ell{0%,80%,100%{opacity:.15}40%{opacity:1}}

.shim{height:6px;margin-top:14px;border-radius:3px;background:linear-gradient(90deg,#2a2c30 30%,#8B5CF6 50%,#2a2c30 70%);background-size:200% 100%;animation:shim 1.5s linear infinite}

@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}

/* ===== efecto de escritura (el texto completo ya ocupa su sitio: la isla no salta) ===== */

.th{visibility:hidden}

.tv.typing::after{content:"";display:inline-block;width:0;height:1em;vertical-align:-.15em;box-shadow:2px 0 0 0 currentColor;animation:blink .8s steps(2) infinite}

.ans{font-size:18px;line-height:1.5;color:#e6e7ea;max-height:300px;overflow-y:auto;white-space:pre-wrap;scrollbar-width:thin;scrollbar-color:#333 transparent}

@media (prefers-reduced-motion:reduce){#isl.vz,#isl.rise,.live,.ell i,.shim,.rip{animation:none}}

/* ===== escuchando / hablando: cabecera, onda y karaoke ===== */

.vc{padding-left:30px}   /* aire entre Miku y el icono (las ondas del micro se expanden ~20 px) */

.vh{display:flex;align-items:center;gap:14px}

.mb{position:relative;flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#22C5E8;background:color-mix(in srgb,currentColor calc(14% + var(--lv,0)*30%),transparent)}

.mb.sp{color:#3B9BF5}.mb .i{width:20px;height:20px;transform:scale(calc(1 + var(--lv,0)*.3))}

@keyframes mring{from{transform:scale(1);opacity:.55}to{transform:scale(2);opacity:0}}

#tr{font-weight:500;color:#8e919a;min-width:240px}#tr.on{color:#fff}

#tr.on:after{content:"";display:inline-block;width:2px;height:1em;margin-left:3px;background:#22C5E8;vertical-align:-.12em;animation:blink .8s steps(2) infinite}

.kar{font-weight:500;font-size:24px;line-height:1.35;max-width:440px}.kw{color:#6b6f78;transition:color .25s,text-shadow .25s}.kw.d{color:#fff}.kw.n{color:#6cb2f5;text-shadow:0 0 14px #3B9BF599}

.wvw{position:relative;height:56px;min-width:260px;margin-top:10px}.wvw canvas{position:absolute;inset:0;width:100%;height:100%}

.vf{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:6px}.vf span{font-size:15px;color:#8e919a}.vf button{font-size:14px;padding:8px 16px}

.spb{display:flex;align-items:center;gap:14px;margin-top:16px}

.eqm{flex:none;display:flex;align-items:center;gap:3px;height:30px;padding:0 12px;border-radius:99px;background:#3B9BF51f}

.eqm i{width:4px;height:100%;border-radius:2px;background:#6cb2f5;transform:scaleY(.2)}

.kp{flex:1;min-width:120px;height:6px;border-radius:3px;background:#2a2c30;overflow:hidden}.kp i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#3B9BF5,#8B5CF6)}

.stp{flex:none;width:36px;height:36px;padding:0;border-radius:50%;display:grid;place-items:center}.stp .i{width:14px;height:14px}

/* iconos SVG (heredan el color con currentColor) */

.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.top b .i,.mic .i{width:20px;height:20px}

#demo{position:fixed;bottom:8px;left:0;right:0;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:0 10px}

#demo button{font-size:12px;padding:4px 9px;border-radius:7px;background:#1b222c;border:1px solid #2b3542}

</style></head>

<body>

<div id="isl"><canvas id="cv"></canvas><div id="in"></div></div>

<div id="demo"></div>

<script>

// ============ Utilidades ============

const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];

const mix=(c,t,k)=>{for(let i=0;i<3;i++)c[i]+=(t[i]-c[i])*k};

const css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${Math.max(0,Math.min(1,a))})`;

const rnd=(a,b)=>a+Math.random()*(b-a);

const INK='#14141c';



class Spring{ // resorte amortiguado: efecto gelatina

  constructor(v=0,k=200,d=12){this.v=v;this.t=v;this.vel=0;this.k=k;this.d=d}

  step(dt){for(let i=0;i<2;i++){const h=dt/2;this.vel+=(this.k*(this.t-this.v)-this.d*this.vel)*h;this.v+=this.vel*h}}

}

function squircle(w,h,n=3.1,N=180){

  const p=new Path2D();

  for(let i=0;i<=N;i++){const a=2*Math.PI*i/N,c=Math.cos(a),s=Math.sin(a);

    const x=w/2*Math.sign(c)*Math.abs(c)**(2/n),y=h/2*Math.sign(s)*Math.abs(s)**(2/n);

    i?p.lineTo(x,y):p.moveTo(x,y)}

  p.closePath();return p;

}

function heart(s){const p=new Path2D();p.moveTo(0,s*.9);

  p.bezierCurveTo(-s*1.7,-s*.1,-s*.8,-s*1.15,0,-s*.35);

  p.bezierCurveTo(s*.8,-s*1.15,s*1.7,-s*.1,0,s*.9);return p}

function star(r){const p=new Path2D();

  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;

    i?p.lineTo(Math.cos(a)*q,Math.sin(a)*q):p.moveTo(Math.cos(a)*q,Math.sin(a)*q)}

  p.closePath();return p}



// ============ Estados ============

const S=(tint,glow,badge,eyes,o={})=>({tint,glow,badge,eyes,tilt:0,look:[0,0],cheek:1,emit:null,es:1,eyeY:0,talk:0,squint:0,...o});

const PILL=c=>['pill',c,''];

const BLUE='#3B9BF5';

const STATES={

  idle:     S('#F3E7E1',null,null,['dot','dot']),

  question: S('#6FD6EA','#22C5E8',['glyph','#22C5E8','?'],['dash','dash'],{tilt:-9,cheek:.35}),

  ratelimit:S('#FFB070','#FF8A2A',['dot','#FF8A2A',''],['dash','dash'],{emit:'drop'}),

  searching:S('#8C88F2','#6A66F0',PILL('#6A66F0'),['dot','dot']),

  sleeping: S('#F7DCE0',null,null,['down','down'],{emit:'z'}),

  thinking: S('#A98BEF','#7C4DE8',PILL('#8B5CF6'),['dot','dot'],{look:[.8,-.95],tilt:5,squint:.5}),   // mira arriba y entrecierra los ojos

  working:  S('#6CB2F5','#2E8CF0',PILL(BLUE),['dot','dot'],{look:[0,.8],eyeY:3}),

  love:     S('#6CB2F5','#2E8CF0',PILL(BLUE),['heart','heart'],{emit:'heart'}),

  proud:    S('#6CB2F5','#2E8CF0',PILL(BLUE),['star','star'],{tilt:8,emit:'star'}),

  surprised:S('#6CB2F5','#2E8CF0',PILL(BLUE),['dot','dot'],{es:.8,eyeY:3}),

  wink:     S('#6CB2F5','#2E8CF0',PILL(BLUE),['dot','up'],{tilt:-5,eyeY:2}),

  yawn:     S('#6CB2F5','#2E8CF0',PILL(BLUE),['down','down'],{tilt:-4,emit:'z'}),

  approval: S('#FFD07A','#FFA51F',['glyph','#FFA51F','!'],['dot','dot']),

  dizzy:    S('#F8A9D0','#FF5FA8',null,['spiral','spiral']),

  error:    S('#F47E80','#E8404A',['dot','#F0434D',''],['dash','dash']),

  finished: S('#C2F0DE','#2DD4A0',['dot','#2DD4A0',''],['up','up'],{emit:'star'}),

};

const EMIT={heart:.45,star:.35,z:1.2,drop:2.2,sound:.06,note:.3};

const RINGS=['thinking','speaking'];            // estados que dibujan ondas alrededor de Mochi



// ============ Personaje ============

class Buddy{

  constructor(){

    this.W=160;this.H=124;this.t=0;this.t0=0;this.state=null;this.cur=STATES.idle;

    this.body=squircle(this.W,this.H);

    this.tint=rgb('#F3E7E1');this.glow=rgb('#6CB2F5');this.glowA=0;

    this.badgeCol=rgb(BLUE);this.badge=PILL(BLUE);

    this.badgeS=new Spring(0,260,15);this.badgeS.t=0;

    this.sq=new Spring(0,230,9);this.hop=new Spring(0,170,11);

    this.rot=new Spring(0,80,9);this.lx=new Spring(0,110,15);this.ly=new Spring(0,110,15);

    this.cheek=1;this.es=1;this.eyeY=0;this.earS=new Spring(0,260,13);this.turnS=new Spring(0,110,13);this.esx=1;this.squint=0;this.talk=0;this.mouthV=0;this.level=0;this.ringA=0;

    this.eyeFrom=this.eyeTo=['dot','dot'];this.eyeMix=1;

    this.nextBlink=1.5;this.blinkP=-1;this.blink=1;

    this.parts=[];this.emitAcc=0;this.m=[0,0,0,0];

  }

  setState(name){

    if(name===this.state||!STATES[name])return;

    const st=STATES[name],first=this.state===null;

    this.state=name;this.cur=st;this.t0=this.t;

    if(st.badge){this.badge=st.badge;this.badgeS.t=1;

      if(first)this.badgeS.v=1;else{this.badgeS.v=.15;this.badgeS.vel=5}}

    else this.badgeS.t=0;

    if(first){this.eyeFrom=this.eyeTo=st.eyes;this.eyeMix=1;this.tint=rgb(st.tint);

      if(st.glow){this.glow=rgb(st.glow);this.glowA=1}}

    else{this.eyeFrom=this.eyeTo;this.eyeTo=st.eyes;this.eyeMix=0;this.sq.vel+=2.2;this.hop.vel-=230}

    this.rot.t=st.tilt;this.lx.t=st.look[0];this.ly.t=st.look[1];

  }

  motion(t,ts){

    const n=this.state,sin=Math.sin;let dx=0,dy=0,rot=0,sq=sin(t*2.2)*.016;

    switch(n){

      case'idle':dy=sin(t*1.1)*1.8;break;

      case'thinking':rot=sin(t*1.1)*3;dx=sin(t*.8)*3;this.lx.t=.7+sin(t*.7)*.3;this.ly.t=-.95+sin(t*1.7)*.12;dy=sin(t*2.2)*1.2;break;

      case'speaking':dy=-this.mouthV*2.4;rot=sin(t*2.1)*1.6;sq=this.mouthV*.035;break;

      case'listening':dy=sin(t*1.8)*1.3;rot=sin(t*1.2)*1.2;sq=-.01*this.level;break;

      case'working':{const b=Math.abs(sin(t*5));dy=-b*4;sq=(1-b)*.045;break}

      case'searching':{const s=sin(t*2.2);this.lx.t=s;dx=s*5;rot=s*3;break}

      case'question':rot=sin(t*2)*2;break;

      case'ratelimit':sq=sin(t*1.2)*.03;dy=sin(t*.7)*1.5;break;

      case'sleeping':sq=sin(t*1.3)*.04;dy=sin(t*1.3)*2;break;

      case'yawn':sq+=-.05*Math.max(0,sin(t*1.1))**2;break;

      case'dizzy':rot=sin(t*3)*10;dx=sin(t*3+1)*6;break;

      case'error':dx=sin(t*45)*7*Math.exp(-ts*3.5);sq*=.5;break;

      case'surprised':dx=sin(t*32)*.7;sq=-.02;break;

      case'approval':{const b=Math.abs(sin(t*3));dy=-b*5;sq=(1-b)*.03;break}

      case'love':sq=.07*Math.max(0,sin(t*6))**6;rot=sin(t*1.5)*2;break;

      case'proud':rot=sin(t*1.5)*1.5;sq=-.02;break;

      case'wink':dy=sin(t*1.3)*1.5;break;

      case'finished':dy=sin(t*1.4)*2;break;

    }

    return[dx,dy,rot,sq];

  }

  step(dt){

    dt=Math.min(dt,1/30);this.t+=dt;const t=this.t,st=this.cur,k=1-Math.exp(-dt*9);

    mix(this.tint,rgb(st.tint),k);

    if(st.glow)mix(this.glow,rgb(st.glow),k);

    this.glowA+=((st.glow?1:0)-this.glowA)*k;

    mix(this.badgeCol,rgb(this.badge[1]),k);

    this.squint+=(st.squint-this.squint)*k;this.talk+=(st.talk-this.talk)*Math.min(1,dt*12);this.ringA+=((RINGS.includes(this.state)?1:0)-this.ringA)*k;

    this.mouthV+=((this.talk>.05?(.08+.92*this.level)*this.talk:0)-this.mouthV)*(1-Math.exp(-dt*28));   // boca: sigue el nivel de audio

    this.cheek+=(st.cheek-this.cheek)*k;this.earS.t=this.turnS.t=this.state==='listening'?1:0;this.es+=(st.es-this.es)*k;this.esx=this.es+(this.state==='listening'?.2*this.level:0);this.eyeY+=(st.eyeY-this.eyeY)*k;

    this.eyeMix=Math.min(1,this.eyeMix+dt*6);

    this.m=this.motion(t,t-this.t0);

    for(const s of[this.sq,this.hop,this.rot,this.lx,this.ly,this.badgeS,this.earS,this.turnS])s.step(dt);

    if(this.blinkP<0&&t>=this.nextBlink)this.blinkP=0;

    if(this.blinkP>=0){this.blinkP+=dt/.16;

      this.blink=Math.max(.08,1-Math.sin(Math.PI*Math.min(1,this.blinkP)));

      if(this.blinkP>=1){this.blinkP=-1;this.blink=1;this.nextBlink=t+(Math.random()<.2?.2:rnd(2.2,5))}}

    this.emit(dt);

    for(const p of this.parts){p.age+=dt;p.x+=p.vx*dt+Math.sin(p.age*3+p.ph)*6*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;

      if(p.kind==='drop')p.vy+=90*dt}

    this.parts=this.parts.filter(p=>p.age<p.life);

  }

  emit(dt){

    const kind=this.cur.emit;if(!kind)return;

    this.emitAcc+=dt;if(this.emitAcc<EMIT[kind])return;this.emitAcc=0;

    if(kind==='sound'&&this.level<.15||kind==='note'&&this.mouthV<.25)return;   // solo cuando hay sonido

    const P=(x,y,vx,vy,life,size)=>this.parts.push({kind,x,y,vx,vy,life,size,age:0,rot:rnd(-20,20),vr:rnd(-60,60),ph:rnd(0,6)});

    if(kind==='heart')P(rnd(-55,55),-40,rnd(-6,6),rnd(-45,-30),2,rnd(7,11));

    else if(kind==='star')P(rnd(-60,60),-42,rnd(-8,8),rnd(-30,-15),1.8,rnd(7,11));

    else if(kind==='z')P(40,-48,8,-22,2.6,10);

    else if(kind==='sound'){const a=rnd(0,7),x=Math.cos(a)*128,y=Math.sin(a)*92;P(x,y,-x*1.3,-y*1.3,.8,rnd(2,3.6))}   // partículas que entran

    else if(kind==='note'){const sd=Math.random()<.5?-1:1;P(sd*28,30,sd*rnd(30,50),rnd(-50,-28),1.6,rnd(6,9))}              // notas que salen de la boca

    else P(4,-62,0,5,1.4,5);

  }

  // ---------- dibujo ----------

  draw(ctx,cx,cy){

    const{W,H,t}=this,[dx,dy,mrot,msq]=this.m;

    if(this.glowA>.01){

      const a=this.glowA*(this.state==='thinking'?.72+.28*Math.sin(t*4.4):.85+.15*Math.sin(t*2.2))*(1+.3*this.level*this.ringA),g=ctx.createRadialGradient(cx,cy+6,0,cx,cy+6,140);

      g.addColorStop(0,css(this.glow,.5*a));g.addColorStop(.55,css(this.glow,.2*a));g.addColorStop(1,css(this.glow,0));

      ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy+6,140,0,7);ctx.fill();

    }

    this.rings(ctx,cx,cy);

    const sq=this.sq.v+msq;

    ctx.save();

    ctx.translate(cx+dx,cy+dy+this.hop.v);ctx.rotate((this.rot.v+mrot)*Math.PI/180);ctx.scale((1+sq*.7)*(1-.1*Math.max(0,this.turnS.v)),1-sq);

    const cream=this.cream||[255,249,244],mid=cream.map((v,i)=>v*.88+this.tint[i]*.12);

    const g=ctx.createLinearGradient(0,-H/2,0,H/2);

    g.addColorStop(0,css(cream));g.addColorStop(.42,css(mid));g.addColorStop(1,css(this.tint));

    ctx.fillStyle=g;ctx.fill(this.body);

    ctx.save();ctx.clip(this.body);

    const hl=ctx.createRadialGradient(-W*.12,-H*.30,0,-W*.12,-H*.30,W*.45);

    hl.addColorStop(0,'rgba(255,255,255,.59)');hl.addColorStop(1,'rgba(255,255,255,0)');

    ctx.fillStyle=hl;ctx.beginPath();ctx.ellipse(-W*.12,-H*.30,W*.45,H*.35,0,0,7);ctx.fill();

    ctx.restore();

    const tn=Math.max(0,this.turnS.v);ctx.save();if(tn>.02)ctx.clip(this.body);ctx.translate(-30*tn,0);ctx.scale(1-.28*tn,1);   // cara de tres cuartos: se desplaza y se estrecha hacia un lado

    if(this.cheek>.02){ctx.fillStyle=`rgba(255,130,160,${.43*this.cheek*(1+.6*this.mouthV)})`;

      for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(s*W*.40,H*.10,11,6,0,0,7);ctx.fill()}}

    // ojos

    const ey=H*.27+this.eyeY,lx=this.lx.v*5,ly=this.ly.v*3.5;let m=this.eyeMix;m=m*m*(3-2*m);

    [-1,1].forEach((sg,side)=>{

      const x=sg*22+lx,y=ey+ly,a=this.eyeFrom[side],b=this.eyeTo[side];

      if(a===b||m>=1)this.eye(ctx,b,x,y,1,sg);

      else{this.eye(ctx,a,x,y,1-m,sg);this.eye(ctx,b,x,y,m,sg)}

    });

    if(this.talk>.05){const o=this.mouthV,vw=.5+.5*Math.sin(t*4.1+Math.sin(t*1.7)*2),      // vocal: ancha ("e") o redonda ("o")

        mx=lx*.5,my=ey+ly*.4+14+o*2.5,rx=3.8+o*(3+vw*5),ry=1.4+o*(8.5-vw*3),ca=Math.min(1,this.talk*1.6),op=Math.min(1,o*7);

      ctx.save();ctx.globalAlpha=ca*(1-op);ctx.strokeStyle=INK;ctx.lineWidth=2.8;ctx.lineCap='round';           // sonrisa cuando calla

      ctx.beginPath();ctx.moveTo(mx-6,my-1);ctx.quadraticCurveTo(mx,my+5,mx+6,my-1);ctx.stroke();ctx.restore();

      if(op>.02){ctx.save();ctx.globalAlpha=ca*op;const mp=new Path2D();mp.ellipse(mx,my,rx,ry,0,0,7);

        ctx.fillStyle=INK;ctx.fill(mp);ctx.clip(mp);                                                              // boca abierta + lengua

        if(o>.25){ctx.fillStyle='#F2788F';ctx.beginPath();ctx.ellipse(mx,my+ry*.65,rx*.75,ry*.55,0,0,7);ctx.fill()}

        ctx.restore()}}

    ctx.restore();

    this.ear(ctx);                                               // la oreja va por delante del cuerpo, en el costado

    const bs=Math.max(0,this.badgeS.v);

    if(bs>.01)this.drawBadge(ctx,-W*.37,-H*.37,bs);

    ctx.restore();

    for(const q of this.parts)this.drawPart(ctx,cx+q.x,cy+q.y,q);

  }

  ear(ctx){                                                      // oreja con el mismo lenguaje que el cuerpo: degradado crema→tinte, brillo suave, sin contorno, rosa de mejilla

    const a=Math.max(0,this.earS.v);if(a<.02)return;

    const k=a*(1+.08*this.level)*1.25,cream=this.cream||[255,249,244],mid=cream.map((v,i)=>v*.88+this.tint[i]*.12),dark=this.tint.map(v=>v*.5);

    if(!this.earP)this.earP=new Path2D('M-11 10C-15-4-6-17 3-19C12-17 16 0 12 10C6 14-5 14-11 10Z');

    ctx.save();ctx.translate(this.W*.39,this.H*.12);ctx.rotate(.28+Math.sin(this.t*13)*this.level*.22);ctx.scale(k,k);ctx.translate(0,-10);   // pivota desde la base

    const g=ctx.createLinearGradient(0,-19,0,14);g.addColorStop(0,css(cream));g.addColorStop(.42,css(mid));g.addColorStop(1,css(this.tint));

    ctx.save();ctx.shadowColor=css(dark,.45);ctx.shadowBlur=8;ctx.shadowOffsetX=2.5;ctx.shadowOffsetY=2;ctx.fillStyle=g;ctx.fill(this.earP);ctx.restore();   // sombra suave del color del cuerpo

    ctx.save();ctx.clip(this.earP);const hl=ctx.createRadialGradient(-5,-9,0,-5,-9,15);hl.addColorStop(0,'rgba(255,255,255,.59)');hl.addColorStop(1,'rgba(255,255,255,0)');

    ctx.fillStyle=hl;ctx.fillRect(-22,-26,44,44);ctx.restore();                                                                                      // mismo brillo que el cuerpo

    ctx.save();ctx.translate(1.2,3.4);ctx.scale(.52,.58);ctx.fillStyle='rgba(255,130,160,.5)';ctx.fill(this.earP);ctx.restore();                      // interior = rosa de las mejillas

    ctx.restore();

  }

  rings(ctx,cx,cy){                                              // ondas alrededor de Mochi según el estado

    const A=this.ringA;if(A<.02)return;

    const n=this.state,t=this.t,L=this.level;ctx.save();ctx.lineWidth=2.4;

    for(let i=0;i<3;i++){let p,al,rx,ry;

      if(n==='listening'){p=(t*.75+i/3)%1;al=Math.sin(Math.PI*p)*(.22+.5*L);rx=80+46*(1-p)+L*8;ry=62+36*(1-p)+L*6}   // ondas que ENTRAN: está escuchando

      else if(n==='speaking'){p=(t*1.1+i/3)%1;al=(1-p)*(.12+.55*this.mouthV);rx=82+p*44;ry=64+p*34}                  // ondas que SALEN: está hablando

      else{p=(t*.5+i/3)%1;al=Math.sin(Math.PI*p)*.4;rx=82+p*34;ry=64+p*26}                                           // pulso lento: está pensando

      ctx.strokeStyle=css(this.glow,al*A);ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,7);ctx.stroke()}

    ctx.restore();

  }

  eye(ctx,kind,x,y,alpha,sg){

    if(alpha<=.01)return;

    ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=INK;ctx.fillStyle=INK;

    ctx.lineWidth=3.6;ctx.lineCap='round';ctx.lineJoin='round';

    if(kind==='dot'){ctx.beginPath();ctx.ellipse(x,y,6*this.esx,7.4*this.esx*this.blink*(1-.52*this.squint),0,0,7);ctx.fill()}

    else if(kind==='dash'){ctx.beginPath();ctx.moveTo(x-7,y);ctx.lineTo(x+7,y);ctx.stroke()}

    else if(kind==='up'){ctx.beginPath();ctx.moveTo(x-8,y+4);ctx.quadraticCurveTo(x,y-9,x+8,y+4);ctx.stroke()}

    else if(kind==='down'){ctx.beginPath();ctx.moveTo(x-8,y-2);ctx.quadraticCurveTo(x,y+9,x+8,y-2);ctx.stroke()}

    else if(kind==='spiral'){

      ctx.lineWidth=2.4;ctx.beginPath();const a0=this.t*7*-sg;

      for(let i=0;i<=60;i++){const th=i/60*4.5*Math.PI,r=1+th*.78,px=x+Math.cos(th+a0)*r,py=y+Math.sin(th+a0)*r;

        i?ctx.lineTo(px,py):ctx.moveTo(px,py)}

      ctx.stroke();

    }

    else if(kind==='heart'){ctx.translate(x,y);ctx.fillStyle='#FF5476';ctx.fill(heart(8.5))}

    else if(kind==='star'){ctx.translate(x,y);ctx.rotate(sg*8*Math.PI/180);ctx.fillStyle='#FFB020';ctx.fill(star(11))}

    ctx.restore();

  }

  drawBadge(ctx,bx,by,s){

    const[kind,,glyph]=this.badge,col=css(this.badgeCol);

    ctx.save();ctx.translate(bx,by);ctx.scale(s,s);

    if(kind==='pill'){

      ctx.fillStyle=INK;ctx.beginPath();ctx.roundRect(-26,-16,52,32,16);ctx.fill();

      ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(-22,-12,44,24,12);ctx.fill();

      ctx.fillStyle='#fff';

      const active=['thinking','working','searching','love','proud','surprised','wink','yawn'].includes(this.state);

      for(let i=-1;i<=1;i++){const off=active?-3.2*Math.max(0,Math.sin(this.t*6-(i+1)*.9)):0;

        ctx.beginPath();ctx.arc(i*11,off,3.4,0,7);ctx.fill()}

    }else{

      ctx.fillStyle=INK;ctx.beginPath();ctx.arc(0,0,16,0,7);ctx.fill();

      ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,12.5,0,7);ctx.fill();

      if(glyph){ctx.fillStyle='#fff';ctx.font='bold 17px Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(glyph,0,1)}

    }

    ctx.restore();

  }

  drawPart(ctx,x,y,q){

    const life=q.age/q.life,a=Math.max(0,Math.min(1,(1-life)*2.5,q.age/.2));

    ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);

    if(q.kind==='heart'){ctx.rotate(q.rot*.3*Math.PI/180);ctx.fillStyle='#FF5476';ctx.fill(heart(q.size))}

    else if(q.kind==='star'){ctx.rotate(q.rot*Math.PI/180);ctx.fillStyle='#FFB020';ctx.fill(star(q.size))}

    else if(q.kind==='z'){ctx.fillStyle='#CDD7F5';ctx.font=`bold ${q.size*(1+life*.9)|0}px Arial,sans-serif`;

      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Z',0,0)}

    else if(q.kind==='sound'){ctx.fillStyle='#7EE7FF';ctx.beginPath();ctx.arc(0,0,q.size*(1-life*.4),0,7);ctx.fill()}

    else if(q.kind==='note'){const s=q.size;ctx.rotate(q.rot*.3*Math.PI/180);ctx.fillStyle=ctx.strokeStyle='#CFE3FF';ctx.lineWidth=1.8;ctx.lineCap='round';

      ctx.beginPath();ctx.ellipse(0,0,s*.55,s*.4,-.45,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(s*.5,-s*.1);ctx.lineTo(s*.5,-s*1.9);ctx.quadraticCurveTo(s*1.3,-s*1.5,s*1.1,-s*.8);ctx.stroke()}

    else{const s=q.size,p=new Path2D();p.moveTo(0,-s*1.6);p.bezierCurveTo(s*1.2,-s*.2,s,s,0,s);

      p.bezierCurveTo(-s,s,-s*1.2,-s*.2,0,-s*1.6);ctx.fillStyle='#6EB4FF';ctx.fill(p)}

    ctx.restore();

  }

}

</script>

<script>

 korus:{n:'Korus',src:'Claude Code',dot:'#ff6b5e',c:'#6CB2F5',tint:'#6CB2F5',bd:'#2E8CF0',s:'work',g:'#2E8CF040',act:['Autorizar la migración','approval'],

 sbe:{n:'SBE Hub',src:'Claude Code',dot:'#2dd4a0',c:'#3ed1b0',tint:'#4FD3B1',bd:'#22C5E8',s:'wait',g:'#22C5E844',act:['Responder','question'],

   steps:[['done','Auditoría del esquema de cursos'],['run','Esperando tu respuesta'],['todo','Conectar la búsqueda']]},

 mb:{n:'Morning Brief',src:'n8n',dot:'#ffb020',c:'#e8b04a',tint:'#F0B94F',bd:'#FF5A4D',s:'err',g:'#E8404A44',act:['Ver el error','error'],

   steps:[['done','Lectura de los newsletters'],['run','Nodo Gmail caducado (30 s)'],['todo','Envío del brief de las 8 h']]},

 ig:{n:'Publicación IG',src:'Make',dot:'#a995ef',c:'#a995ef',tint:'#A995EF',bd:'#22C5E8',s:'idle',g:'#8B5CF633',

// ===== escenas =====

   <div class=c2>${Object.entries(AG).filter(([k])=>k!==sel).map(([k,b])=>`<button class=chip style="--c:${b.c}" data-a="ag:${k}"><canvas class=mc data-id=${k} width=96 height=76></canvas>${b.n}</button>`).join('')}</div></div>`}},

 approval:{st:'approval',t:'o',x:()=>row('#FFA51F44',`${PH(.85)}<div class=c>${src('#ff6b5e','Korus','Claude Code quiere ejecutar un comando')}<code>npx prisma migrate deploy</code><div class=bt>${B('Rechazar','','flash:Rechazado.:error','N')}${B('Permitir siempre','','flash:Anotado, lo recordaré.:proud')}${B('Autorizar','p','flash:¡Lanzado!:working','S')}</div></div>`)},

// ===== efecto de escritura: escribe letra a letra los elementos .tw (el texto completo ya está maquetado, oculto) =====

let twTok=0;

function typewriter(root,cps){

  const tok=++twTok,els=[...root.querySelectorAll('.tw')];

  if(!els.length||REDUCE())return;

  const it=els.map(el=>{const full=el.textContent,v=document.createElement('span'),h=document.createElement('span');

    v.className='tv';h.className='th';h.textContent=full;el.textContent='';el.append(v,h);return{el,v,h,full}});

  const total=it.reduce((a,x)=>a+x.full.length,0),rate=cps||Math.max(70,total/1.6),t0=performance.now()+220;let last=-1;   // súper rápido: máx. ~1,6 s en total

  const tick=now=>{

    if(tok!==twTok)return;

    const n=Math.max(0,((now-t0)/1000*rate)|0);

    if(n!==last){last=n;let r=n,caret=false;

      for(const x of it){const k=Math.min(x.full.length,r);r-=k;x.v.textContent=x.full.slice(0,k);x.h.textContent=x.full.slice(k);

        const here=!caret&&k<x.full.length;x.v.classList.toggle('typing',here);if(k<x.full.length)caret=true;

        if(here&&x.el.classList.contains('ans')){const a=x.v.getBoundingClientRect(),b=x.el.getBoundingClientRect();if(a.bottom>b.bottom-8)x.el.scrollTop+=a.bottom-b.bottom+24}}

      if(n>=total){it.forEach(x=>{x.el.textContent=x.full});return}}

    requestAnimationFrame(tick)};

  requestAnimationFrame(tick);

}

// ===== onda de voz (canvas): cintas al escuchar, barras con picos al hablar =====

function drawWave(c,t){

  const W=c.clientWidth,H=56;if(!W)return;

  if(c.width!==W*2){c.width=W*2;c.height=H*2}

  const g=c.getContext('2d'),L=buddy.level;g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,W,H);

  const gr=g.createLinearGradient(0,0,W,0);

  if(c.dataset.k==='l'){gr.addColorStop(0,'#22C5E800');gr.addColorStop(.25,'#22C5E8');gr.addColorStop(.75,'#2DD4A0');gr.addColorStop(1,'#2DD4A000');

    g.lineCap='round';g.strokeStyle=gr;

    for(let j=0;j<3;j++){g.beginPath();g.globalAlpha=[1,.5,.28][j];g.lineWidth=[2.6,2,1.6][j];const A=(3+L*22)*(1-.22*j);

      for(let x=0;x<=W;x+=3){const e=Math.pow(Math.sin(Math.PI*x/W),1.6),y=H/2+(Math.sin(x*.045*(1+j*.35)+t*(2.6+j*1.3))+.28*Math.sin(x*.11-t*3+j))*A*e;x?g.lineTo(x,y):g.moveTo(x,y)}

      g.stroke()}

  }else{gr.addColorStop(0,'#3B9BF5');gr.addColorStop(1,'#8B5CF6');

    const n=Math.floor(W/7),b=c._s&&c._s.length===n?c._s:(c._s=Array.from({length:n},()=>({v:0,p:0})));

    for(let i=0;i<n;i++){const u=i/(n-1),tg=L*(.4+.6*Math.sin(Math.PI*u))*(.2+.8*Math.abs(Math.sin(t*6.5+i*.55)*Math.cos(t*2.7+i*1.1))),o=b[i];

      o.v+=(tg-o.v)*(tg>o.v?.4:.12);o.p=Math.max(o.v,o.p-.012);                      // sube rápido, cae suave; el pico cae más despacio

      const h=3+o.v*(H-8),ph=3+o.p*(H-8),x=i*7+1.5;

      g.globalAlpha=1;g.fillStyle=gr;g.beginPath();g.roundRect(x,(H-h)/2,4,h,2);g.fill();

      g.globalAlpha=.55;g.beginPath();g.arc(x+2,(H-ph)/2-3.5,1.3,0,7);g.fill();g.beginPath();g.arc(x+2,(H+ph)/2+3.5,1.3,0,7);g.fill()}

  }

  g.globalAlpha=1;

}

// Requiere "withGlobalTauri": true en tauri.conf.json. Fuera de Tauri esto no hace nada.

const T=window.__TAURI__,PAD=16;let winT,curW=0,curH=0;

window.SIZES={};                                                 // [ancho,alto] de cada escena, se rellena solo

async function setWin(W,H){

  const win=T.window.getCurrentWindow(),mon=await T.window.currentMonitor(),sf=mon.scaleFactor;

  const x=mon.position.x/sf+(mon.size.width/sf-W)/2,y=mon.position.y/sf;   // centrada arriba, como el notch

  await win.setSize(new T.dpi.LogicalSize(W,H));await win.setPosition(new T.dpi.LogicalPosition(x,y));curW=W;curH=H;

}

function fitWindow(w,h){

  if(!T||!T.window)return;

  const W=w+PAD,H=h+PAD/2,gw=Math.max(W,curW),gh=Math.max(H,curH);

  clearTimeout(winT);setWin(gw,gh);                              // crece al instante (cabe el rebote)…

  if(gw>W||gh>H)winT=setTimeout(()=>setWin(W,H),700);             // …y encoge cuando termina la animación

}

if(T){document.documentElement.style.background=document.body.style.background='transparent';$('#demo').remove()}   // en Tauri: fondo transparente y sin barra de pruebas

if(T&&T.window){const win=T.window.getCurrentWindow();           // los ojos siguen al cursor aunque esté fuera de la ventana

// window.setEstado('escuchando...' | 'pensando...' | 'hablando...' | 'idle')   → cambia la isla y la cara de Mochi

// window.setNivelMic(0..1)    → volumen del micro (opcional; si no llega, se simula)

// window.setNivelVoz(0..1)    → volumen del audio TTS (opcional; mueve la boca. Si no llega, se simula)

// window.setTranscripcion(t)  → lo que el usuario va diciendo        window.setHabla(t) → subtítulo de lo que dice Claude

// window.mostrarResultado(t)  → pasa a "result" y escribe el texto letra a letra

// Eventos que emite la isla: 'isla:voz' (detail = listening|thinking|speaking) y 'isla:cancelar' (Esc durante la voz).

// TAURI (HAY QUE CONFIGURARLO, es solo un ejemplo): T.event.listen('estado',e=>setEstado(e.payload));  T.event.listen('nivel-voz',e=>setNivelVoz(e.payload));

const VOZ={escuchando:'listening',pensando:'thinking',hablando:'speaking',idle:'compact',listo:'compact',reposo:'compact'};

window.setEstado=txt=>{DEMO_VOZ=false;const k=String(txt).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,''),n=VOZ[k];if(n&&cur!==n)go(n)};

window.setTranscripcion=t=>{const e=$('#tr');if(e){e.textContent=t||'Habla ahora…';e.classList.toggle('on',!!t)}};

window.setHabla=(t,ms)=>{SPEAK=String(t);SPEAK_MS=+ms||0;if(cur==='speaking')go('speaking')};

window.mostrarResultado=t=>{RESP={text:String(t)};go('result')};

let micV=0,vozV=0,micT=0,vozT=0;

window.setNivelMic=v=>{micV=clamp(+v||0,0,1);micT=performance.now()};

window.setProgresoHabla=p=>{karP=clamp(+p||0,0,1);karPT=performance.now()};   // opcional: 0..1 para sincronizar el karaoke con el audio real

window.setNivelVoz=v=>{vozV=clamp(+v||0,0,1);vozT=performance.now()};

function level(k,t){                                             // nivel real si llega del backend; si no, una voz simulada

  if(performance.now()-(k==='mic'?micT:vozT)<400)return k==='mic'?micV:vozV;

  const env=.55+.45*Math.sin(t*1.7)*Math.sin(t*.63+1);

  return clamp(env*(.55+.45*Math.abs(Math.sin(t*9.3)*Math.cos(t*3.9))),0,1)}



// ===== loop =====

let last=performance.now(),bx=40,by=12,bkk=.13;

function drawMail(){

  const b=buddy,m=b.mb.v;if(m<.02)return;

  const[dx,dy,mr,msq]=b.m,sq=b.sq.v+msq,hh=15+clamp(b.op.v,0,1.2)*10;

  ctx.save();ctx.globalAlpha=Math.min(1,m);

  ctx.translate(150+dx,150+dy+b.hop.v);ctx.rotate((b.rot.v+mr)*Math.PI/180);ctx.scale(1+sq*.7,1-sq);

  ctx.fillStyle=INK;ctx.beginPath();ctx.roundRect(-60,-46.5-hh/2,120,hh,hh/2);ctx.fill();   // ranura: se abre al acercar el cursor

  b.drawBadge(ctx,-b.W*.37,-b.H*.37,Math.max(0,b.badgeS.v));                                 // la pastilla queda encima de la ranura

  ctx.restore();

}

function drawDoc(q){                                             // el archivo cae dentro de la ranura

  if(!sw||!swFrom)return;

  const t=clamp((performance.now()-swT)/450,0,1),p=t*t,fx=150+(swFrom[0]-q.left-bx)/bkk,fy=150+(swFrom[1]-q.top-by)/bkk;

  ctx.save();ctx.translate(fx+(150-fx)*p,fy+(98-fy)*p);ctx.scale(1.4*(1-.7*p),1.4*(1-.7*p));ctx.globalAlpha=1-.4*p;

  ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(-17,-22,34,44,5);ctx.fill();

  ctx.fillStyle='#ef4444';ctx.fillRect(-10,4,20,8);ctx.restore();

}

function frame(now){

  const dt=Math.min((now-last)/1000,1/30);last=now;

  if(!NOLOOK.includes(buddy.state)){buddy.lx.t=lk[0]*1.4;buddy.ly.t=lk[1]*1.2;buddy.rot.t=buddy.cur.tilt+lk[0]*3}  // ojos + cabeza siguen al cursor

  const vs=buddy.state,tsec=now/1000;buddy.level=vs==='speaking'?level('voz',tsec):vs==='listening'?level('mic',tsec):0;

  if(vs==='listening')buddy.sq.t=-.05*buddy.level;else if(vs==='speaking')buddy.sq.t=-.03*buddy.level;else if(cur!=='drag')buddy.sq.t=0;

  buddy.step(dt);buddy.mb.step(dt);buddy.op.step(dt);

  for(const a of Object.values(AG)){a.b.step(dt);if(a.s==='work'&&a.b.t%1.3<dt)a.b.hop.vel-=90}   // el agente que trabaja da saltitos

  const ph=isl.querySelector('.ph'),q=isl.getBoundingClientRect();

  if(CHASE&&cur==='drag'&&dp){                                          // persigue el cursor dentro de la isla

    const k=1-Math.exp(-dt*8),tx=clamp(dp[0]-q.left,70,q.width-70),ty=clamp(dp[1]-q.top,60,q.height-45);

    if(!sw)buddy.op.t=clamp(1-Math.hypot(dp[0]-q.left-bx,dp[1]-q.top-by)/200,0,1);

    bx+=(tx-bx)*k;by+=(ty-by)*k;bkk+=(.87-bkk)*k;

  }else if(ph&&!sw){const r=ph.getBoundingClientRect(),k=1-Math.exp(-dt*14);

    bx+=(r.left-q.left+r.width/2-bx)*k;by+=(r.top-q.top+r.height/2-by)*k;bkk+=(+ph.dataset.k-bkk)*k}

  cv.style.transform=`translate(${bx-150}px,${by-150}px) scale(${bkk})`;

  ctx.clearRect(0,0,300,300);buddy.draw(ctx,150,150);drawMail();drawDoc(q);

  for(const c of isl.querySelectorAll('.wv'))drawWave(c,tsec);

  const mb=$('#mb');if(mb)mb.style.setProperty('--lv',buddy.level.toFixed(2));if(cur==='speaking'){document.querySelectorAll('.eqm i').forEach((b,i)=>b.style.transform=`scaleY(${Math.min(1,.2+buddy.level*(.3+.7*Math.abs(Math.sin(tsec*9+i*1.7)))).toFixed(2)})`);karaoke()}

  for(const c of isl.querySelectorAll('.mc')){const g=c.getContext('2d');g.setTransform(.5,0,0,.5,0,0);g.clearRect(0,0,192,152);AG[c.dataset.id].b.draw(g,96,76)}

  requestAnimationFrame(frame);

}

requestAnimationFrame(frame);
